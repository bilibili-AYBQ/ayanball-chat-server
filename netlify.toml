# ================= AyanBall Chat Server · Netlify 配置 =================
# 动态服务端：netlify/functions（业务 API + Pusher 实时鉴权 + 文件预签名直传）
# 静态资源：public（图形化管理面板 admin.html + 服务状态页 index.html）
# 无前端构建：服务端不打包 Vite 客户端（客户端源码另行用 Tauri 打包 EXE）
[build]
  command = "npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 客户端走根路径访问函数（不带 /.netlify/functions），需重写到对应函数
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/file"
  to = "/.netlify/functions/file"
  status = 200

[[redirects]]
  from = "/update"
  to = "/.netlify/functions/update"
  status = 200

[[redirects]]
  from = "/pusher"
  to = "/.netlify/functions/pusher"
  status = 200
